name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc 11,         runner: ubuntu-22.04, preset: linux-gcc,   packages: g++-11 libcurl4-openssl-dev,   cc: gcc-11,   cxx: g++-11 }
          - { name: gcc 12,         runner: ubuntu-24.04, preset: linux-gcc,   packages: g++-12 libcurl4-openssl-dev,   cc: gcc-12,   cxx: g++-12 }
          - { name: gcc 13,         runner: ubuntu-24.04, preset: linux-gcc,   packages: g++-13 libcurl4-openssl-dev,   cc: gcc-13,   cxx: g++-13 }
          - { name: gcc 14,         runner: ubuntu-24.04, preset: linux-gcc,   packages: g++-14 libcurl4-openssl-dev,   cc: gcc-14,   cxx: g++-14 }
          - { name: clang 14,       runner: ubuntu-22.04, preset: linux-clang, packages: clang-14 libcurl4-openssl-dev, cc: clang-14, cxx: clang++-14 }
          - { name: clang 15,       runner: ubuntu-22.04, preset: linux-clang, packages: clang-15 libcurl4-openssl-dev, cc: clang-15, cxx: clang++-15 }
          - { name: clang 16,       runner: ubuntu-24.04, preset: linux-clang, packages: clang-16 libcurl4-openssl-dev, cc: clang-16, cxx: clang++-16 }
          - { name: clang 17,       runner: ubuntu-24.04, preset: linux-clang, packages: clang-17 libcurl4-openssl-dev, cc: clang-17, cxx: clang++-17 }
          - { name: clang 18,       runner: ubuntu-24.04, preset: linux-clang, packages: clang-18 libcurl4-openssl-dev, cc: clang-18, cxx: clang++-18 }
          - { name: clang latest,   runner: ubuntu-24.04, preset: linux-clang, packages: libcurl4-openssl-dev, llvm: latest }
          - { name: clang libc++,   runner: ubuntu-24.04, preset: linux-clang-libcxx, packages: clang-18 libc++-18-dev libc++abi-18-dev libcurl4-openssl-dev, cc: clang-18, cxx: clang++-18 }

          - { name: gcc warnings are errors,   runner: ubuntu-24.04, preset: linux-gcc-ci,           packages: libcurl4-openssl-dev }
          - { name: clang warnings are errors, runner: ubuntu-24.04, preset: linux-clang-ci,         packages: libcurl4-openssl-dev }
          - { name: clang asan ubsan,          runner: ubuntu-24.04, preset: linux-clang-asan-ubsan, packages: libcurl4-openssl-dev }
          - { name: clang tsan,                runner: ubuntu-24.04, preset: linux-clang-tsan,       packages: libcurl4-openssl-dev }
          - { name: clang fuzzers,             runner: ubuntu-24.04, preset: linux-clang-fuzz,       packages: libcurl4-openssl-dev }

          - { name: gcc x86,        runner: ubuntu-24.04,     preset: linux-gcc-x86,   packages: 'g++-multilib libcurl4-openssl-dev:i386',   i386: true }
          - { name: clang x86,      runner: ubuntu-24.04,     preset: linux-clang-x86, packages: 'g++-multilib libcurl4-openssl-dev:i386',   i386: true }
          - { name: gcc arm64,      runner: ubuntu-24.04-arm, preset: linux-gcc,       packages: libcurl4-openssl-dev }
          - { name: clang arm64,    runner: ubuntu-24.04-arm, preset: linux-clang,     packages: libcurl4-openssl-dev }

          - { name: gcc armv7,      runner: ubuntu-24.04, preset: linux-armv7,   packages: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user }
          - { name: gcc riscv64,    runner: ubuntu-24.04, preset: linux-riscv64, packages: gcc-riscv64-linux-gnu g++-riscv64-linux-gnu qemu-user }
          - { name: gcc ppc64le,    runner: ubuntu-24.04, preset: linux-ppc64le, packages: gcc-powerpc64le-linux-gnu g++-powerpc64le-linux-gnu qemu-user }
          - { name: gcc s390x,      runner: ubuntu-24.04, preset: linux-s390x,   packages: gcc-s390x-linux-gnu g++-s390x-linux-gnu qemu-user }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: add the i386 architecture
        if: matrix.i386
        run: |
          sudo dpkg --add-architecture i386
          echo "PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig" >> "$GITHUB_ENV"

      - name: install
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.packages }}

      - name: install the latest clang
        if: matrix.llvm == 'latest'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh
          echo "C_COMPILER=$(ls /usr/bin/clang-[0-9]* | sort -V | tail -1)" >> "$GITHUB_ENV"
          echo "CXX_COMPILER=$(ls /usr/bin/clang++-[0-9]* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: configure
        run: |
          c="${C_COMPILER:-${{ matrix.cc }}}"
          cxx="${CXX_COMPILER:-${{ matrix.cxx }}}"
          cmake --preset ${{ matrix.preset }} ${c:+"-DCMAKE_C_COMPILER=$c"} ${cxx:+"-DCMAKE_CXX_COMPILER=$cxx"}

      - name: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: test
        run: ctest --preset ${{ matrix.preset }}

  linux-containers:
    name: linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc latest,  image: 'gcc:latest',    install: 'apt-get update && apt-get install -y git cmake ninja-build libcurl4-openssl-dev' }
          - { name: musl alpine, image: 'alpine:latest', install: 'apk add --no-cache git gcc g++ cmake samurai curl-dev' }

    steps:
      - name: install
        run: ${{ matrix.install }}

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: configure
        run: cmake --preset linux-gcc

      - name: build
        run: cmake --build --preset linux-gcc

      - name: test
        run: ctest --preset linux-gcc

  macos:
    name: macos ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: apple clang arm64,  runner: macos-15 }
          - { name: apple clang x86_64, runner: macos-15-intel }
          - { name: apple clang older,  runner: macos-14 }
          - { name: gcc arm64,          runner: macos-15, gcc: true }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: use Homebrew's gcc
        if: matrix.gcc
        run: |
          brew install gcc
          echo "CC=$(ls "$(brew --prefix gcc)"/bin/gcc-[0-9]* | sort -V | tail -1)" >> "$GITHUB_ENV"
          echo "CXX=$(ls "$(brew --prefix gcc)"/bin/g++-[0-9]* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: configure
        run: cmake --preset macos-clang

      - name: build
        run: cmake --build --preset macos-clang

      - name: test
        run: ctest --preset macos-clang

  windows:
    name: windows ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: msvc x64 (2022),            runner: windows-2022,  preset: windows-msvc }
          - { name: msvc x64,                   runner: windows-2025,  preset: windows-msvc }
          - { name: msvc warnings are errors,   runner: windows-2025,  preset: windows-msvc-ci }
          - { name: msvc x86,                   runner: windows-2025,  preset: windows-msvc-x86 }
          - { name: msvc arm64,                 runner: windows-11-arm, preset: windows-msvc-arm64 }
          - { name: clang-cl x64,               runner: windows-2025,  preset: windows-clang-cl }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: configure
        run: cmake --preset ${{ matrix.preset }}

      - name: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: test
        run: ctest --preset ${{ matrix.preset }}

  mingw:
    name: windows mingw ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc x64,   msystem: UCRT64,  cc: gcc,   cxx: g++ }
          - { name: clang x64, msystem: CLANG64, cc: clang, cxx: clang++ }

    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          pacboy: toolchain:p cmake:p ninja:p

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: configure
        run: cmake --preset windows-mingw -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: build
        run: cmake --build --preset windows-mingw

      - name: test
        run: ctest --preset windows-mingw

  android:
    name: android ${{ matrix.preset }} (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [android-arm64, android-armv7, android-x86_64, android-x86]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: configure
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cmake --preset ${{ matrix.preset }}

      - name: build
        run: cmake --build --preset ${{ matrix.preset }}

  android-emulator:
    name: android x86_64 (tests on an emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: let the emulator use kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: configure
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cmake --preset android-x86_64

      - name: build
        run: cmake --build --preset android-x86_64

      - name: test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: ctest --test-dir out/build/android-x86_64 --output-on-failure

  emscripten:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [emscripten, emscripten-pthreads, emscripten-wasm64]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: configure
        run: emcmake cmake --preset ${{ matrix.preset }} "-DCMAKE_CROSSCOMPILING_EMULATOR=$(command -v node)"

      - name: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: test
        run: ctest --preset ${{ matrix.preset }}

  freebsd:
    name: freebsd clang
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: vmactions/freebsd-vm@v1
        with:
          prepare: pkg install -y cmake ninja curl
          run: |
            cmake --preset freebsd-clang
            cmake --build --preset freebsd-clang
            ctest --preset freebsd-clang

  standards:
    name: headers standalone (${{ matrix.compiler }}, ${{ matrix.std }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        std: [c++20, c++23, c++2c]

    steps:
      - uses: actions/checkout@v7

      - name: every header compiles alone, warnings are errors
        run: |
          for header in http http/buffering_response_handler http/context http/exception http/policy http/post \
              http/request http/response_handler http/types http/curl_context http/null_context; do
            printf '#include <jfc/%s.h>\nint main(){}\n' "$header" > alone.cpp
            ${{ matrix.compiler }} -std=${{ matrix.std }} -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wdeprecated -Werror \
                -Iinclude -Iimpl/curl/include -Iimpl/null/include -c alone.cpp -o /dev/null
          done

  documentation:
    name: doxygen
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install doxygen, graphviz, ninja and libcurl
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz ninja-build libcurl4-openssl-dev

      - name: generate
        run: cmake --preset linux-docs

      - name: upload for github pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/build/linux-docs/docs

  pages:
    name: publish to github pages
    needs: documentation
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
